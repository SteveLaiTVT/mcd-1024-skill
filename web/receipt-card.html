<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Static page: no network requests at all (no fetch, fonts, images or trackers). The meal data
       lives only in the URL fragment (after '#'), which browsers never send to a server. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>麦麦饱饱盘 · 选餐卡片</title>
  <style>
    :root { --ink: #2b2118; --soft: #7a6a5c; --line: #eadfce; --paper: #fffaf2; --bg: #f3e9da; --accent: #c2571a; --chip: #fbeedd; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 0%, #fff3e0 0, var(--bg) 60%); color: var(--ink);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      display: flex; justify-content: center; padding: max(20px, env(safe-area-inset-top)) 16px 32px; }
    main { width: 100%; max-width: 420px; }
    .card { background: var(--paper); border-radius: 22px; box-shadow: 0 18px 40px rgba(80, 50, 20, .14), 0 2px 6px rgba(80, 50, 20, .08); overflow: hidden; }
    header { padding: 20px 22px 14px; border-bottom: 2px dashed var(--line); }
    .brand { font-size: 13px; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
    h1 { margin: 6px 0 4px; font-size: 26px; line-height: 1.25; word-break: break-word; }
    .meta { color: var(--soft); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .items { list-style: none; margin: 0; padding: 14px 22px; }
    .items li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .items li:last-child { border-bottom: 0; }
    .qty { color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .price { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 22px; background: var(--chip); }
    .price b { font-size: 30px; font-variant-numeric: tabular-nums; }
    .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #fff; color: var(--accent); border: 1px solid #f0c9a8; }
    .note { margin: 0; padding: 12px 22px; font-size: 15px; border-top: 2px dashed var(--line); word-break: break-word; }
    .note span { color: var(--soft); }
    .muted { color: var(--soft); font-size: 14px; padding: 4px 22px 14px; margin: 0; }
    .notice { margin-top: 16px; padding: 14px 18px; border-radius: 16px; background: #fff; border: 1px solid #f0c9a8; font-size: 14px; }
    .notice strong { display: block; color: var(--accent); margin-bottom: 4px; }
    .notice p { margin: 2px 0; }
    .empty { padding: 32px 22px; text-align: center; }
    .empty h1 { font-size: 22px; }
    a { color: var(--accent); }
    footer { text-align: center; color: var(--soft); font-size: 12px; margin-top: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <article class="card" id="card" hidden>
      <header>
        <div class="brand">麦麦饱饱盘 · 选餐卡片</div>
        <h1 id="title"></h1>
        <div class="meta"><span id="store"></span><span id="time"></span></div>
      </header>
      <ul class="items" id="items"></ul>
      <p class="muted" id="no-items" hidden>二维码容量有限，这张卡片只带了套餐名、价格、门店和时间。</p>
      <div class="price"><span>整单 <span class="tag" id="sample" hidden>历史样本价</span></span><b id="price"></b></div>
      <p class="note" id="note" hidden><span>备注：</span><span id="note-text"></span></p>
    </article>

    <section class="card empty" id="empty" hidden>
      <div class="brand">麦麦饱饱盘 · 选餐卡片</div>
      <h1>链接里没有订单数据</h1>
      <p>请用终端版小票上的二维码打开，或检查链接是否完整（# 后面那一段）。</p>
      <p><a href="https://github.com/SteveLaiTVT/mcd-1024-skill" rel="noopener noreferrer">查看项目仓库</a></p>
    </section>

    <section class="notice">
      <strong>非官方产品 · 参赛者独立开发 · 只记录这次的选择</strong>
      <p>请在麦当劳官方渠道下单。</p>
      <p>本工具不下单、不付款；这张卡片不是订单，也不是付款码。</p>
      <p>价格与供应以麦当劳官方结果为准。</p>
    </section>
    <footer>卡片内容只在链接里，本页不联网、不记录。</footer>
  </main>
  <script>
    // Card format: <base>#v1~title~priceFen~store~time~sp~items~note, items = name*qty,name*qty.
    // '~', ',', '*', '\', '%' inside a field value are percent-encoded, so a literal
    // '~' / ',' / '*' is always a structural separator. Split first, then decode
    // each field (decoding the whole fragment first would turn data '~' into
    // separators). See tui/card.mjs.
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var str = function (v, max) { return typeof v === 'string' ? v.slice(0, max) : ''; };
      function dec(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
      function decode(fragment) {
        var parts = fragment.replace(/^#/, '').split('~');
        if (parts.length !== 8 || parts[0] !== 'v1') return null;
        var t = dec(parts[1]), p = parseInt(parts[2], 10), s = dec(parts[3]), at = dec(parts[4]), sp = parts[5], itemsStr = parts[6], note = dec(parts[7]);
        if (!t || !Number.isSafeInteger(p) || p < 0) return null;
        var items = [];
        if (itemsStr === '-') { /* items dropped for size: the no-items note covers it */ }
        else if (itemsStr) {
          var itemParts = itemsStr.split(','), j, star, name, q;
          for (j = 0; j < itemParts.length; j++) {
            star = itemParts[j].lastIndexOf('*');
            name = dec(star < 0 ? itemParts[j] : itemParts[j].slice(0, star));
            if (!name) return null;
            q = star < 0 ? 1 : parseInt(itemParts[j].slice(star + 1), 10);
            items.push({ n: name, q: Number.isSafeInteger(q) && q > 0 ? q : 1 });
          }
        }
        var data = { t: t, p: p, s: s, at: at, items: items };
        if (note) data.note = note;
        if (sp === '1') data.sp = 1;
        return data;
      }
      function render() {
        var data = null;
        try { data = decode(location.hash || ''); } catch (e) { data = null; }
        $('card').hidden = !data; $('empty').hidden = !!data;
        if (!data) { document.title = '麦麦饱饱盘 · 选餐卡片'; return; }
        $('title').textContent = str(data.t, 80);
        document.title = str(data.t, 40) + ' · 选餐卡片';
        $('store').textContent = str(data.s, 60) ? '门店：' + str(data.s, 60) : '';
        $('time').textContent = str(data.at, 20) ? '时间：' + str(data.at, 20) : '';
        $('price').textContent = '¥' + (data.p / 100).toFixed(2);
        $('sample').hidden = data.sp !== 1;
        var list = $('items'), items = Array.isArray(data.items) ? data.items.slice(0, 20) : [];
        list.textContent = '';
        items.forEach(function (item) {
          if (!item || typeof item.n !== 'string') return;
          var li = document.createElement('li'), name = document.createElement('span'), qty = document.createElement('span');
          name.textContent = item.n.slice(0, 60);
          qty.className = 'qty'; qty.textContent = '×' + (Number.isSafeInteger(item.q) && item.q > 0 ? item.q : 1);
          li.appendChild(name); li.appendChild(qty); list.appendChild(li);
        });
        list.hidden = !list.children.length; $('no-items').hidden = !!list.children.length;
        var note = str(data.note, 80);
        $('note').hidden = !note; $('note-text').textContent = note;
      }
      window.addEventListener('hashchange', render);
      render();
    })();
  </script>
</body>
</html>
